name: playspot_flutter
description: PlaySpot — find a game near you. Flutter port of the original web app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  socket_io_client: ^2.0.0
  google_sign_in: ^6.2.2
  http: ^1.2.0
  shared_preferences: ^2.2.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  geolocator: ^12.0.0
  geocoding: ^2.1.0
  video_player: ^2.9.1
  share_plus: ^10.1.3
  web: ^1.1.1
  url_launcher: ^6.2.0
  screenshot: ^3.0.0
  go_router: ^14.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/branding/
    - assets/Activity icon/
    - assets/square_blurbg/
